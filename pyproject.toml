[project]
name = "Mostro-AI-Playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "malobaprecious5-cell", email = "maloba@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "langchain-core>=1.6.6",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "orjson>=3.12.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
playground = "playground:main"

[project.optional-dependencies]
ingest = [
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ai", "playground"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.1.54",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
